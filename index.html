<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cheff</title>
<meta name="description" content="Toutes mes apps, au même endroit.">
<meta name="theme-color" content="#070b14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,96,500;1,96,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Plein écran WebGL : fond sombre et chaud avec un grand « cheff » en italique,
   une barre de verre en bas qui contient les apps sous forme de gouttes de verre liquide.
   Univers unique et assumé (sombre), couleurs explicites. */
:root{
  color-scheme: dark;
  --night: #070b14;
  --ink: #f4efe7;
  --dim: rgba(244,239,231,.56);
  --hair: rgba(255,255,255,.22);
  --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--ui); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 2px solid rgba(255,255,255,.8); outline-offset: 3px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
#gl.grab { cursor: grabbing; }
#gl.over { cursor: pointer; }
.probe { position: fixed; left: 0; top: 0; width: 0; height: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); pointer-events: none; visibility: hidden; }

.top {
  position: fixed; z-index: 5; left: 0; right: 0; top: 0; pointer-events: none;
  display: flex; justify-content: space-between; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) var(--gr) 0 var(--gl);
}
.brand { font: 600 13px var(--ui); letter-spacing: .08em; }
.right { display: flex; align-items: center; gap: 12px; pointer-events: auto; }
.clock { font: 500 13px var(--ui); color: var(--dim); font-variant-numeric: tabular-nums; }
.snd {
  font: 500 12px var(--ui); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  background: rgba(255,255,255,.07); border: 1px solid var(--hair); color: var(--ink);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.snd[aria-pressed="false"] { color: var(--dim); }

#layer { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
.ico { position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; will-change: transform, opacity; }
.ico svg { width: 100%; height: 100%; stroke: #f4e2b8; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 3px rgba(0,0,0,.45)); }
.lbl { position: absolute; left: 0; top: 0; font: 500 11.5px var(--ui); color: rgba(240,226,196,.76); white-space: nowrap; transition: opacity .3s; will-change: transform; }
.hint {
  position: fixed; z-index: 3; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: var(--gl); padding-right: var(--gr); text-align: center; pointer-events: none;
  font: 400 12px/1.4 var(--ui); color: rgba(244,239,231,.42); letter-spacing: .02em; transition: opacity .8s;
}

#card {
  position: fixed; z-index: 6; left: 0; top: 0; box-sizing: border-box; opacity: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 28px 24px; text-align: center;
}
#card.live { pointer-events: auto; }
.c-icon { width: 54px; height: 54px; margin-bottom: 4px; }
.c-icon svg { width: 100%; height: 100%; stroke: #e9cf95; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.c-kicker { font: 500 11px var(--ui); letter-spacing: .26em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.c-title { margin: 0; font: italic 500 clamp(46px, 13vw, 72px)/1 var(--serif); letter-spacing: -.01em; color: #efd9a6; }
.c-desc { margin: 2px 0 0; font: 400 15px/1.5 var(--ui); color: rgba(244,239,231,.8); max-width: 28ch; }
.c-host { font: 500 13px var(--ui); color: var(--dim); }
.c-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
.btn {
  padding: 12px 22px; border-radius: 999px; cursor: pointer; font: 500 14px var(--ui);
  border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); color: var(--ink);
}
.btn.primary { background: linear-gradient(180deg, #f6e3b4, #c9a35e); color: #191207; border-color: transparent; }
.toast {
  position: fixed; z-index: 9; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 56px);
  transform: translate(-50%, -12px); opacity: 0; transition: opacity .35s, transform .45s cubic-bezier(.2,1.3,.3,1);
  max-width: calc(100vw - 32px); box-sizing: border-box; padding: 11px 16px; border-radius: 16px; pointer-events: none;
  background: rgba(20,20,24,.72); border: 1px solid var(--hair); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  font: 400 13.5px/1.4 var(--ui); color: var(--ink); text-align: center;
}
.toast b { font-weight: 600; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Repli sans WebGL */
.nogl .ico { width: 62px; height: 62px; margin: -31px 0 0 -31px; padding: 17px; box-sizing: border-box; border-radius: 50%; background: rgba(255,255,255,.1); border: 1px solid var(--hair); pointer-events: auto; cursor: pointer; }
.nogl #layer { pointer-events: none; }
</style>
</head>
<body>

<canvas id="gl" aria-label="cheff.ch : le logo du chef et la signature Cheff en or, et les apps en gouttes de verre. Glisse-les, touche-en une pour l'ouvrir."></canvas>
<div class="probe" id="probe"></div>
<header class="top">
  <div class="brand">cheff.ch</div>
  <div class="right"><span class="clock" id="clock">--:--</span><button class="snd" id="snd" aria-pressed="true">Son</button></div>
</header>
<div id="layer" aria-hidden="true"></div>
<div class="hint" id="hint">Glisse les gouttes · Touche pour ouvrir</div>
<div id="card" role="dialog" aria-modal="true" aria-labelledby="c-title" hidden>
  <div class="c-icon" id="c-icon"></div>
  <div class="c-kicker" id="c-kicker">App 01 sur 08</div>
  <h2 class="c-title" id="c-title">Ambiance</h2>
  <p class="c-desc" id="c-desc"></p>
  <div class="c-host" id="c-host"></div>
  <div class="c-actions">
    <button class="btn primary" id="c-open" type="button">Ouvrir l'app</button>
    <button class="btn" id="c-close" type="button">Fermer</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICONS = {
  ambiance: '<rect x="3.5" y="7" width="11" height="11" rx="2.5" transform="rotate(-12 9 12.5)"/><circle cx="7.6" cy="11.3" r=".9"/><circle cx="10.6" cy="14.2" r=".9"/><path d="M15.5 4.5l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/><path d="M19.5 10.5l.4 1 1 .4-1 .4-.4 1-.4-1-1-.4 1-.4z"/>',
  factures: '<path d="M6 2.8h8.5L19 7.3v13.9H6z"/><path d="M14.5 2.8v4.5H19"/><rect x="8.6" y="12.6" width="4.6" height="4.6" rx=".6"/><path d="M10.9 14.9h.01M15.4 12.8h1.2M15.4 15h1.2M8.8 9.6h4.2"/>',
  frais: '<path d="M6 2.8h12v18.4l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z"/><path d="M9 7.5h6M9 11h6M9 14.5h3.5"/>'
};
const APPS = [
  { id:'ambiance', name:'Ambiance', desc:"62 jeux de soirée, tous jouables en ligne avec tes amis.", url:'https://ambiance.cheff.ch/' },
  { id:'factures', name:'Mes Factures', desc:"Factures suisses avec QR-facture, offres, rappels et TVA.", url:'https://factures.cheff.ch/' },
  { id:'frais', name:'Mes Frais', desc:"Photographie tes tickets : montant et date lus automatiquement, tableau Excel prêt.", url:'https://frais.cheff.ch/' }
];
const N = APPS.length;
const host = a => a.url.replace(/^https:\/\//, '').replace(/\/$/, '');
const rgb = h => { const n = parseInt(h.slice(1), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);

/* ---------- horloge ---------- */
const tickClock = () => { $('clock').textContent = new Date().toLocaleTimeString('fr-CH', { hour: '2-digit', minute: '2-digit' }); };
tickClock(); setInterval(tickClock, 15000);

/* ---------- toast ---------- */
let toastT;
function toast(html) { const t = $('toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

/* ---------- son discret (synthétisé) ---------- */
let AC = null, master = null, soundOn = true, NB = null;
function unlock() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 1; master.connect(AC.destination); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
const live = () => soundOn && AC && AC.state === 'running';
function env(t, a, d, p) { const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(p, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); g.connect(master); return g; }
function tone(type, f0, f1, t, dur, g) { const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur * .6); o.connect(g); o.start(t); o.stop(t + dur + .05); }
function sTick(f = 2300, p = .035) { if (!live()) return; const t = AC.currentTime; tone('sine', f, 0, t, .14, env(t, .002, .12, p)); tone('sine', f * 1.5, 0, t, .1, env(t, .002, .08, p * .5)); }
function sBloop(k = 1) { if (!live()) return; const t = AC.currentTime, f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400; const g = env(t, .004, .16, .07 * k); f.connect(g); const o = AC.createOscillator(); o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(560, t + .08); o.connect(f); o.start(t); o.stop(t + .2); }
function sPull() { if (!live()) return; const t = AC.currentTime; tone('sine', 620, 230, t, .14, env(t, .003, .13, .05)); }
function sSwap() { if (!live()) return; const t = AC.currentTime; tone('sine', 1568, 0, t, .12, env(t, .002, .1, .03)); setTimeout(() => { if (live()) { const t2 = AC.currentTime; tone('sine', 2093, 0, t2, .14, env(t2, .002, .12, .03)); } }, 70); }
function sOpen() {
  if (!live()) return; const t = AC.currentTime;
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const n = AC.createBufferSource(), f = AC.createBiquadFilter(); n.buffer = NB; f.type = 'bandpass'; f.Q.value = .8; f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(3200, t + .45);
  n.connect(f); f.connect(env(t, .08, .45, .05)); n.start(t); n.stop(t + .6);
  [1046.5, 1568, 2093].forEach((fr, i) => tone('sine', fr, 0, t + .05 + i * .03, 1.4, env(t + .05 + i * .03, .01, 1.3, .022)));
}
function sClose() { if (!live()) return; const t = AC.currentTime; [2093, 1568, 1046.5].forEach((fr, i) => tone('sine', fr, 0, t + i * .04, .7, env(t + i * .04, .005, .6, .02))); }
function sLens() { if (!live()) return; const t = AC.currentTime; tone('sine', 170, 300, t, .3, env(t, .03, .28, .045)); }
const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
$('snd').addEventListener('click', () => { unlock(); soundOn = !soundOn; $('snd').setAttribute('aria-pressed', soundOn); $('snd').textContent = soundOn ? 'Son' : 'Son coupé'; if (soundOn) sTick(); });

/* ---------- calques HTML : icônes + noms ---------- */
const layer = $('layer');
const icoEls = APPS.map(a => { const el = document.createElement('div'); el.className = 'ico'; el.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[a.id]}</svg>`; layer.appendChild(el); return el; });
const lblEls = APPS.map(a => { const el = document.createElement('div'); el.className = 'lbl'; el.textContent = a.name; layer.appendChild(el); return el; });

/* ---------- géométrie ---------- */
let W = 0, H = 0, dpr = 1, safeT = 0, safeB = 0, R = 30, cell = 80;
const panel = { x: 0, y: 0, hw: 0, hh: 0, r: 0 };
let slots = [];
let order = [...Array(N).keys()];
try { const o = JSON.parse(localStorage.getItem('cheff.order') || 'null'); if (Array.isArray(o) && o.length === N && [...o].sort().join() === [...Array(N).keys()].join()) order = o; } catch (e) {}
const saveOrder = () => { try { localStorage.setItem('cheff.order', JSON.stringify(slots.map((_, k) => drops.findIndex(d => d.slot === k)))); } catch (e) {} };
const t0 = performance.now();
const drops = APPS.map((a, i) => ({ a, i, slot: order.indexOf(i), x: 0, y: 0, vx: 0, vy: 0, s: 0, sv: 0, st: 1, stretch: 0, ang: 0, drag: false, fx: 0, fy: 0, touch: new Set(), out: false, delay: t0 + (RM ? 0 : 450 + order.indexOf(i) * 75) }));
const lens = { x: -999, y: -999, vx: 0, vy: 0, tx: 0, ty: 0, r: 0, rv: 0, rt: 0, stretch: 0, ang: 0 };
let open = null;

function sdRBox(px, py, cx, cy, hw, hh, r) { r = Math.min(r, hw, hh); const qx = Math.abs(px - cx) - hw + r, qy = Math.abs(py - cy) - hh + r; return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; }
const sdPanel = (x, y) => sdRBox(x, y, panel.x, panel.y, panel.hw, panel.hh, panel.r);

function layout() {
  W = innerWidth; H = innerHeight;
  const ps = getComputedStyle($('probe')); safeT = parseFloat(ps.paddingTop) || 0; safeB = parseFloat(ps.paddingBottom) || 0;
  const wide = W >= 760, cols = Math.min(N, wide ? 8 : 4), rows = Math.ceil(N / cols);
  cell = wide ? 108 : Math.min(108, (W - 32) / cols - 2);
  R = clamp(cell * .34, 22, 31);
  const padTop = 16, rowH = R * 2 + 32;
  const pw = cols * cell + 16, ph = rows * rowH + padTop - 4;
  const bottom = H - safeB - 46;
  panel.hw = pw / 2; panel.hh = ph / 2; panel.x = W / 2; panel.y = bottom - ph / 2; panel.r = R + padTop;
  const top = panel.y - panel.hh;
  slots = [];
  for (let k = 0; k < N; k++) { const r = Math.floor(k / cols), c = k % cols; slots.push({ x: W / 2 - cols * cell / 2 + cell * (c + .5), y: top + padTop + R + r * rowH }); }
  for (const d of drops) if (d.s === 0 && !d.x) { d.x = slots[d.slot].x; d.y = slots[d.slot].y + 30; }
  for (const d of drops) if (!d.drag && performance.now() > d.delay + 1500) { d.x = slots[d.slot].x; d.y = slots[d.slot].y; }
  lblEls.forEach(el => { el.style.opacity = ''; });
}

/* ---------- WebGL ---------- */
const cv = $('gl');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uDpr; uniform float uTime; uniform vec2 uView; uniform float uTA;
uniform vec2 uLight; uniform float uSweep; uniform vec4 uWm;
uniform sampler2D uText;
uniform vec4 uPanel; uniform float uPanelR;
uniform vec4 uDrop[9]; uniform vec4 uDropV[9]; uniform vec3 uTint[9];
uniform vec4 uCard; uniform float uCardR; uniform float uCardOn; uniform vec3 uCardTint;
uniform float uDim;
out vec4 outColor;
float dot2(vec2 v){ return dot(v, v); }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float sdRBox(vec2 p, vec2 b, float r){ r = min(r, min(b.x, b.y)); vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float bev(float d, float b){ float e = clamp(-d / max(b, 1.0), 0.0, 1.0); return sqrt(1.0 - (1.0 - e) * (1.0 - e)); }
float dropD(int i, vec2 p){
  vec4 D = uDrop[i]; vec2 q = p - D.xy; float a = uDropV[i].y, st = uDropV[i].x;
  float c = cos(a), s = sin(a); q = vec2(c * q.x + s * q.y, -s * q.x + c * q.y);
  q.x /= (1.0 + st); q.y *= (1.0 + st * 0.45);
  return length(q) - D.z;
}
float sdfAll(vec2 p){
  float d = sdRBox(p - uPanel.xy, uPanel.zw, uPanelR);
  for (int i = 0; i < 9; i++){ if (uDrop[i].z < 0.5) continue; d = smin(d, dropD(i, p), 28.0); }
  if (uCardOn > 0.5) d = smin(d, sdRBox(p - uCard.xy, uCard.zw, uCardR), 30.0);
  return d;
}
float field(vec2 p, out float dU, out vec4 tint, out float cw){
  dU = sdRBox(p - uPanel.xy, uPanel.zw, uPanelR);
  float hd = 0.0; tint = vec4(0.0); cw = 0.0;
  for (int i = 0; i < 9; i++){
    if (uDrop[i].z < 0.5) continue;
    float d = dropD(i, p);
    dU = smin(dU, d, 28.0);
    hd = max(hd, bev(d, uDrop[i].z));
    float w = clamp(-d / (uDrop[i].z * 0.6), 0.0, 1.0);
    tint += vec4(uTint[i] * w, w);
  }
  if (uCardOn > 0.5){
    float d = sdRBox(p - uCard.xy, uCard.zw, uCardR);
    dU = smin(dU, d, 30.0);
    hd = max(hd, bev(d, min(46.0, min(uCard.z, uCard.w))));
    cw = clamp(-d / 26.0, 0.0, 1.0);
    tint += vec4(uCardTint * cw, cw);
  }
  return bev(dU, 20.0) * 0.55 + hd * 0.8;
}
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
vec3 blobs(vec2 uv){
  float asp = uView.x / uView.y; vec2 q = vec2(uv.x * asp, uv.y); float t = uTime;
  vec3 c = vec3(0.030, 0.044, 0.078);
  c += vec3(0.07, 0.10, 0.18) * exp(-2.6 * dot2(q - vec2(asp * 0.5, 0.33)));
  c += vec3(0.55, 0.40, 0.17) * 0.16 * exp(-7.0 * dot2(q - vec2(asp * (0.5 + 0.14 * sin(t * 0.10)), 0.30 + 0.06 * cos(t * 0.13))));
  c += vec3(0.04, 0.09, 0.20) * 0.7 * exp(-4.0 * dot2(q - vec2(asp * (0.12 + 0.06 * cos(t * 0.08)), 0.86 + 0.04 * sin(t * 0.11))));
  c += vec3(0.30, 0.20, 0.08) * 0.10 * exp(-5.0 * dot2(q - vec2(asp * (0.88 + 0.05 * sin(t * 0.09)), 0.70)));
  c *= 1.0 - 0.45 * dot2((uv - vec2(0.5, 0.42)) * vec2(1.1, 0.9));
  return c;
}
// Le logo et la signature : or brossé en relief, éclairé par une lumière qui suit le doigt
vec3 wordmark(vec2 p, vec2 uv){
  vec2 e = vec2(1.3) / uView;
  float l = textureLod(uText, uv - vec2(e.x, 0.0), 1.3).r, r = textureLod(uText, uv + vec2(e.x, 0.0), 1.3).r;
  float u = textureLod(uText, uv - vec2(0.0, e.y), 1.3).r, d = textureLod(uText, uv + vec2(0.0, e.y), 1.3).r;
  vec3 n = normalize(vec3((l - r) * 2.4, (u - d) * 2.4, 1.0));
  vec3 L = normalize(vec3(uLight - p, 200.0));
  float diff = clamp(dot(n, L), 0.0, 1.0);
  float spec = pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 34.0);
  float brush = 0.93 + 0.07 * hash(vec2(floor(p.y * 1.4 - p.x * 0.45), 7.0));
  vec3 col = mix(vec3(0.40, 0.27, 0.10), vec3(0.80, 0.62, 0.32), smoothstep(0.0, 0.62, diff));
  col = mix(col, vec3(1.0, 0.90, 0.64), smoothstep(0.58, 1.0, diff));
  col *= brush;
  float fres = pow(clamp(1.0 - n.z, 0.0, 1.0), 1.2);
  col = mix(col, col * 0.75 + blobs(clamp(uv + n.xy * 0.2, 0.0, 1.0)) * vec3(1.6, 1.4, 1.1), 0.25 * fres);
  col += spec * vec3(1.0, 0.94, 0.80) * 1.15;

function resize() {

/* ---------- ouverture d'une app ---------- */
const card = $('card');
let cardRect = { x: 0, y: 0, hw: 0, hh: 0 };
function cardGeom() { const top = safeT + 58, bottom = panel.y - panel.hh - 28, hw = Math.min(W - 32, 440) / 2, hh = clamp((bottom - top) / 2, 160, 250); cardRect = { x: W / 2, y: Math.max(top + hh, (top + bottom) / 2), hw, hh }; }
function openApp(i) {
  if (open) return;
  const d = drops[i], a = d.a; cardGeom();
  open = { i, m: 0, mv: 0, mt: 1 };
  $('c-icon').innerHTML = `<svg viewBox="0 0 24 24">${ICONS[a.id]}</svg>`;
  $('c-kicker').textContent = `App ${String(d.slot + 1).padStart(2, '0')} sur ${String(N).padStart(2, '0')}`;
  $('c-title').textContent = a.name; $('c-desc').textContent = a.desc; $('c-host').textContent = host(a);
  Object.assign(card.style, { width: cardRect.hw * 2 + 'px', height: cardRect.hh * 2 + 'px', transform: `translate(${cardRect.x - cardRect.hw}px, ${cardRect.y - cardRect.hh}px)` });
  card.hidden = false; sOpen(); buzz(10);
  if (!gl) { card.style.opacity = 1; card.classList.add('live'); card.style.background = 'rgba(20,20,24,.9)'; card.style.borderRadius = '34px'; }

}
function closeApp() {
  if (!open || open.mt === 0) return;
  open.mt = 0; card.classList.remove('live'); sClose(); buzz(6);

}
$('c-close').addEventListener('click', closeApp);
$('c-open').addEventListener('click', () => { const a = drops[open.i].a; sTick(2800, .04); location.href = a.url; });
addEventListener('keydown', e => { if (e.key === 'Escape') closeApp(); });

/* ---------- gestes ---------- */
let ptr = null, hover = -1, interactions = 0;
const pos = e => ({ x: e.clientX, y: e.clientY });
const light = { x: 0, y: 0, tx: 0, ty: 0, at: -1e9, init: false };
const aim = p => { light.tx = p.x; light.ty = p.y; light.at = performance.now(); };
function hit(p) { let best = -1, bd = 1e9; drops.forEach((d, i) => { const dd = Math.hypot(p.x - d.x, p.y - d.y); if (dd < R * Math.max(d.s, .6) + 10 && dd < bd) { bd = dd; best = i; } }); return best; }
function noteInteraction() { if (++interactions === 4) $('hint').style.opacity = 0; }
cv.addEventListener('pointerdown', e => {
  unlock();
  const p = pos(e); aim(p);
  if (open) { if (open.mt === 1 && sdRBox(p.x, p.y, cardRect.x, cardRect.y, cardRect.hw, cardRect.hh, 34) > 0) closeApp(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const i = hit(p);
  if (i >= 0) {
    const d = drops[i];
    ptr = { id: e.pointerId, mode: 'drop', i, sx: p.x, sy: p.y, t: performance.now(), moved: false, ox: p.x - d.x, oy: p.y - d.y, type: e.pointerType };
    d.st = .86; sTick(2400, .03); buzz(5);
  } else {
    ptr = { id: e.pointerId, mode: 'lens', type: e.pointerType };
    lens.tx = p.x; lens.ty = p.y; if (lens.r < 2) { lens.x = p.x; lens.y = p.y; lens.vx = lens.vy = 0; }
    lens.rt = Math.min(64, W * .16); sLens(); buzz(4);
  }
  noteInteraction();
});
cv.addEventListener('pointermove', e => {
  const p = pos(e); if (e.pointerType !== 'mouse' || p.x || p.y) aim(p);
  if (!ptr) {
    if (e.pointerType === 'mouse' && !open) {
      hover = hit(p); cv.classList.toggle('over', hover >= 0);
      lens.tx = p.x; lens.ty = p.y; if (lens.r < 2) { lens.x = p.x; lens.y = p.y; }

  if (e.pointerId !== ptr.id) return;

    if (!ptr.moved && Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 7) { ptr.moved = true; d.drag = true; d.st = 1.14; cv.classList.add('grab'); }
    if (d.drag) {
      d.fx = p.x - ptr.ox * .6; d.fy = p.y - ptr.oy * .6;
      for (const o of drops) {
        if (o === d) continue;
        const touch = Math.hypot(o.x - d.x, o.y - d.y) < R * (d.s + o.s) + 18;
        if (touch && !d.touch.has(o)) { d.touch.add(o); sBloop(); buzz(5); } else if (!touch) d.touch.delete(o);
      }
      const sd = sdPanel(d.x, d.y), out = sd > R * 1.25;
      if (out && !d.out) { d.out = true; sPull(); buzz(6); } else if (!out && d.out && sd < 0) { d.out = false; sBloop(.8); buzz(4); }
    }

});
function release(e) {
  if (!ptr || e.pointerId !== ptr.id) return;

  if (ptr.mode === 'drop') {

    else {
      d.drag = false; d.st = 1; d.touch.clear(); d.out = false;

      if (best >= 0 && best !== d.slot && bd < cell * .6) {

cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', e => { if (!ptr && e.pointerType === 'mouse') { lens.rt = 0; hover = -1; } });

/* ---------- physique ---------- */
function step(f, now) {
  const K0 = RM ? .3 : .085, D0 = RM ? .9 : .17;
  for (const d of drops) {
    const sl = slots[d.slot], tx = d.drag ? d.fx : sl.x, ty = d.drag ? d.fy : sl.y;
    const K = d.drag ? .3 : K0, D = d.drag ? .5 : D0;
    d.vx += ((tx - d.x) * K - d.vx * D) * f; d.vy += ((ty - d.y) * K - d.vy * D) * f;
    d.x += d.vx * f; d.y += d.vy * f;
    let st = now < d.delay ? 0 : d.st;
    if (!d.drag && hover === d.i && !ptr) st = 1.07;
    if (open && open.i !== d.i) st *= .92;
    d.sv += ((st - d.s) * (RM ? .3 : .2) - d.sv * (RM ? .9 : .2)) * f; d.s += d.sv * f; d.s = Math.max(0, d.s);

  lens.x += lens.vx * f; lens.y += lens.vy * f;
  lens.rv += ((lens.rt - lens.r) * .16 - lens.rv * .24) * f; lens.r = Math.max(0, lens.r + lens.rv * f);

    open.mv += ((open.mt - open.m) * K - open.mv * D) * f; open.m += open.mv * f;
  }
}

/* ---------- rendu ---------- */
const UD = new Float32Array(36), UDV = new Float32Array(36), UT = new Float32Array(27);
const tints = APPS.map(() => [0.96, 0.80, 0.50]);
let textAlpha = RM ? 1 : 0, last = performance.now();
function frame(now) {
  const dt = Math.min(64, now - last); last = now;
  const f = dt / 16.67, n = Math.max(1, Math.ceil(f));
  for (let k = 0; k < n; k++) step(f / n, now);
  if (open && open.mt === 0 && open.m < .02 && Math.abs(open.mv) < .02) { drops[open.i].s = .55; drops[open.i].sv = 0; open = null; card.hidden = true; card.style.opacity = 0; }
  textAlpha = 1;
  if (gl && !introDone) drawText(now);
  {
    const ts = (now - t0) / 1000;
    if (now - light.at > 2600) { light.tx = W * (.5 + .34 * Math.sin(ts * .33)); light.ty = (wmBox[1] + wmBox[3]) / 2 - 40 + 90 * Math.cos(ts * .41); }
    if (!light.init) { light.x = light.tx; light.y = light.ty; light.init = true; }
    const k = 1 - Math.pow(1 - .09, f); light.x += (light.tx - light.x) * k; light.y += (light.ty - light.y) * k;
  }

  // calques HTML
  drops.forEach((d, i) => {
    const hidden = open && open.i === i;
    icoEls[i].style.transform = `translate(${d.x.toFixed(1)}px, ${d.y.toFixed(1)}px) scale(${Math.max(0, d.s).toFixed(3)})`;
    icoEls[i].style.opacity = hidden ? 0 : clamp(d.s * 1.2, 0, 1);
    const sl = slots[d.slot], away = Math.hypot(d.x - sl.x, d.y - sl.y) > 10 || hidden;
    lblEls[i].style.transform = `translate(${sl.x.toFixed(1)}px, ${(sl.y + R + 9).toFixed(1)}px) translateX(-50%)`;
    lblEls[i].style.opacity = away ? .15 : (now < d.delay ? 0 : 1);
  });
  if (open) {
    const vis = clamp((open.m - .8) / .18, 0, 1);
    card.style.opacity = vis;
    if (open.mt === 1 && open.m > .9) card.classList.add('live');
  }
  if (!gl) { requestAnimationFrame(frame); return; }

  drops.forEach((d, i) => {
    const hidden = open && open.i === i;
    UD.set([d.x, d.y, hidden ? 0 : R * Math.max(0, d.s), 0], i * 4);
    UDV.set([d.stretch, d.ang, 0, 0], i * 4); UT.set(tints[i], i * 3);

  gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform1f(U.uDpr, cv.width / W); gl.uniform2f(U.uView, W, H);
  gl.uniform1f(U.uTime, RM ? 0 : (now - t0) / 1000); gl.uniform1f(U.uTA, textAlpha);
  gl.uniform2f(U.uLight, light.x, light.y); gl.uniform4f(U.uWm, wmBox[0], wmBox[1], wmBox[2], wmBox[3]);
  { const e = (now - t0 - 3200) % 9000; gl.uniform1f(U.uSweep, RM || now - t0 < 3200 ? -2 : (e < 1700 ? -.35 + 1.7 * (e / 1700) : -2)); }
  gl.uniform4f(U.uPanel, panel.x, panel.y, panel.hw, panel.hh); gl.uniform1f(U.uPanelR, panel.r);

/* ---------- repli sans WebGL ---------- */

}

/* ---------- démarrage ---------- */
try { if (gl) initGL(); } catch (err) { console.error(err); }
resize();
drops.forEach(d => { d.x = slots[d.slot].x; d.y = slots[d.slot].y + (RM ? 0 : 26); });
addEventListener('resize', resize);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('italic 600 100px "Bodoni Moda"'), document.fonts.load('italic 500 60px "Bodoni Moda"'), document.fonts.load('500 11px Inter'), document.fonts.load('400 15px Inter')]).then(() => { if (gl) drawText(); }).catch(() => {});
}
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
